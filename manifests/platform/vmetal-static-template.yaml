## vmetal-static-template.yaml - VirtualClusterTemplate for static bare metal pools
#
# Parameterized template that provisions a vCluster backed by fixed-size bare
# metal node pools via the data-center scoped `us-va-blacksburg-dc1`
# NodeProvider. This mirrors the "reserved capacity" model often used by AI
# clouds, where each machine class has an explicit pool size instead of
# scaling purely on demand.
#
# Parameters:
#   kubernetesVersion - control plane K8s version; update to trigger an upgrade
#   smallNodeCount    - desired number of small-capacity workers
#   mediumNodeCount   - desired number of medium-capacity workers
#   largeNodeCount    - desired number of large-capacity workers
#   customerSelector  - optional comma-separated list of customers to target
#   rackSelector      - optional comma-separated list of racks to target
#
# Apply with:
#   kubectl apply -f manifests/platform/vmetal-static-template.yaml
#
# Then create a VirtualClusterInstance that references this template:
#   kubectl apply -f manifests/platform/vcluster-vmetal-static.yaml
#
# Reference:
#   https://www.vcluster.com/docs/platform/administer/node-providers/metal3

apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: vmetal-static-template
spec:
  displayName: "vMetal - Static Bare Metal Auto Nodes"
  description: >
    vCluster backed by fixed-size bare metal node pools provisioned through the
    Metal3 NodeProvider. Each node class has its own desired quantity, which is
    a better fit for AI-cloud style reserved capacity than a purely dynamic
    scale-up model.

  owner:
    team: loft-admins

  template:
    helmRelease:
      chart:
        version: 0.34.0
      values: |
        privateNodes:
          enabled: true
          autoNodes:
            - provider: us-va-blacksburg-dc1
              static:
                {{ if ne .Values.smallNodeCount "0" }}
                - name: static-small-nodes
                  quantity: {{ .Values.smallNodeCount }}
                  nodeTypeSelector:
                    {{- if and .Values.customerSelector (ne (trim .Values.customerSelector) "") (ne (trim .Values.customerSelector) "all") }}
                    - property: vcluster.com/customer
                      operator: In
                      values:
                        {{- range $customer := splitList "," .Values.customerSelector }}
                        {{- $trimmedCustomer := trim $customer }}
                        {{- if ne $trimmedCustomer "" }}
                        - {{ $trimmedCustomer }}
                        {{- end }}
                        {{- end }}
                    {{- end }}
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - small
                    {{- if and .Values.rackSelector (ne (trim .Values.rackSelector) "") (ne (trim .Values.rackSelector) "all") }}
                    - property: vcluster.com/rack
                      operator: In
                      values:
                        {{- range $rack := splitList "," .Values.rackSelector }}
                        {{- $trimmedRack := trim $rack }}
                        {{- if ne $trimmedRack "" }}
                        - {{ $trimmedRack }}
                        {{- end }}
                        {{- end }}
                    {{- end }}
                {{ end }}
                {{ if ne .Values.mediumNodeCount "0" }}
                - name: static-medium-nodes
                  quantity: {{ .Values.mediumNodeCount }}
                  nodeTypeSelector:
                    {{- if and .Values.customerSelector (ne (trim .Values.customerSelector) "") (ne (trim .Values.customerSelector) "all") }}
                    - property: vcluster.com/customer
                      operator: In
                      values:
                        {{- range $customer := splitList "," .Values.customerSelector }}
                        {{- $trimmedCustomer := trim $customer }}
                        {{- if ne $trimmedCustomer "" }}
                        - {{ $trimmedCustomer }}
                        {{- end }}
                        {{- end }}
                    {{- end }}
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - medium
                    {{- if and .Values.rackSelector (ne (trim .Values.rackSelector) "") (ne (trim .Values.rackSelector) "all") }}
                    - property: vcluster.com/rack
                      operator: In
                      values:
                        {{- range $rack := splitList "," .Values.rackSelector }}
                        {{- $trimmedRack := trim $rack }}
                        {{- if ne $trimmedRack "" }}
                        - {{ $trimmedRack }}
                        {{- end }}
                        {{- end }}
                    {{- end }}
                {{ end }}
                {{ if ne .Values.largeNodeCount "0" }}
                - name: static-large-nodes
                  quantity: {{ .Values.largeNodeCount }}
                  nodeTypeSelector:
                    {{- if and .Values.customerSelector (ne (trim .Values.customerSelector) "") (ne (trim .Values.customerSelector) "all") }}
                    - property: vcluster.com/customer
                      operator: In
                      values:
                        {{- range $customer := splitList "," .Values.customerSelector }}
                        {{- $trimmedCustomer := trim $customer }}
                        {{- if ne $trimmedCustomer "" }}
                        - {{ $trimmedCustomer }}
                        {{- end }}
                        {{- end }}
                    {{- end }}
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - large
                    {{- if and .Values.rackSelector (ne (trim .Values.rackSelector) "") (ne (trim .Values.rackSelector) "all") }}
                    - property: vcluster.com/rack
                      operator: In
                      values:
                        {{- range $rack := splitList "," .Values.rackSelector }}
                        {{- $trimmedRack := trim $rack }}
                        {{- if ne $trimmedRack "" }}
                        - {{ $trimmedRack }}
                        {{- end }}
                        {{- end }}
                    {{- end }}
                {{ end }}
        networking:
          podCIDR: 10.64.0.0/16
          serviceCIDR: 10.128.0.0/16
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          distro:
            k8s:
              version: "{{ .Values.kubernetesVersion }}"

  # ---------------------------------------------------------------------------
  # Parameters - surfaced in the vCluster Platform UI and passed to helm values
  # ---------------------------------------------------------------------------
  parameters:
    - variable: kubernetesVersion
      label: Kubernetes Version
      description: >
        Control plane Kubernetes version. Updating this value triggers a
        rolling upgrade of the vCluster control plane while the fixed worker
        pools remain managed through the NodeClaim lifecycle.
      defaultValue: v1.34.7
      options:
        - v1.33.11
        - v1.34.7
        - v1.35.4

    - variable: smallNodeCount
      label: Small Node Count
      description: >
        Desired quantity for the static small-capacity pool. Capacity can come
        from any rack matched by the optional customer/rack selectors.
      defaultValue: "1"
      options:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"

    - variable: mediumNodeCount
      label: Medium Node Count
      description: >
        Desired quantity for the static medium-capacity pool. The default demo
        inventory has one managed medium-capacity host.
      defaultValue: "0"
      options:
        - "0"
        - "1"
        - "2"

    - variable: largeNodeCount
      label: Large Node Count
      description: >
        Desired quantity for the static large-capacity pool. The default demo
        inventory has one large-capacity host per rack.
      defaultValue: "1"
      options:
        - "0"
        - "1"
        - "2"

    - variable: customerSelector
      label: Customer Selector
      description: >
        Optional comma-separated customer list such as `customer-a` or
        `customer-a,customer-b`. This filters NodeType properties, not
        BareMetalHost labels directly. Leave empty to allow all customers.
      defaultValue: ""

    - variable: rackSelector
      label: Rack Selector
      description: >
        Optional comma-separated rack list such as `rack-a` or
        `rack-a,rack-b`. Leave empty to allow all racks for the selected
        customer set.
      defaultValue: ""
