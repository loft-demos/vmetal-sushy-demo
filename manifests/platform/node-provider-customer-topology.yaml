# node-provider-customer-topology.yaml — Metal3 NodeProvider with customer+rack topology
#
# This is an alternative to node-provider.yaml for demos where vCluster
# autoNodes should be able to select on both customer assignment and physical
# rack identity.
#
# The selectors below assume BareMetalHosts carry these labels:
#   demo: vmetal
#   vmetal-customer: customer-a | customer-b
#   vmetal-rack: rack-a | rack-b
#   vmetal-size: small | medium | large
#
# Reassigning an entire rack is intentionally a label-first workflow:
#   1. Update configs/rack-assignments.csv and regenerate BareMetalHosts, or
#      patch the affected BareMetalHosts' vmetal-customer labels directly.
#   2. Re-apply this manifest if you changed the available rack set. The
#      customer/rack/size permutations are already defined below, so a label
#      change alone is enough for normal customer re-assignment flows.
#
# Apply with:
#   kubectl apply -f manifests/platform/node-provider-customer-topology.yaml

apiVersion: management.loft.sh/v1
kind: NodeProvider
metadata:
  name: metal3-provider
spec:
  displayName: "vMetal Demo - Metal3 Provider (Customer + Rack Topology)"

  properties:
    vcluster.com/os-image: ubuntu-noble-bootstrap
    vcluster.com/ssh-keys: admin-macbook
    vcluster.com/user-data: |
      #cloud-config
      write_files:
        - path: /etc/vcluster-common
          permissions: "0644"
          content: |
            common config
        - path: /usr/local/bin/configure-vdemo-node-bootstrap
          permissions: "0755"
          content: |
            #!/bin/sh
            set -eu

            iface="$(ip route show default 0.0.0.0/0 | awk 'NR==1 {print $5}')"
            [ -n "${iface}" ] || exit 1

            resolvectl domain "${iface}" '~vdemo.local'
            resolvectl default-route "${iface}" yes

            cert_tmp="$(mktemp)"
            tries=0
            while true; do
              if curl -fsSL "http://172.22.0.1:9000/vdemo-platform.crt" -o "${cert_tmp}"; then
                break
              fi
              tries=$((tries + 1))
              if [ "${tries}" -ge 20 ]; then
                echo "failed to download platform certificate after ${tries} attempts" >&2
                exit 1
              fi
              sleep 3
            done

            install -D -m 0644 "${cert_tmp}" /usr/local/share/ca-certificates/vdemo-platform.crt
            rm -f "${cert_tmp}"
            update-ca-certificates
            systemctl try-restart vcluster || true
        - path: /etc/systemd/system/vdemo-resolved-domain.service
          permissions: "0644"
          content: |
            [Unit]
            Description=Configure vdemo.local DNS routing and trust the platform certificate
            Wants=network-online.target
            After=network-online.target systemd-resolved.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/configure-vdemo-node-bootstrap
            RemainAfterExit=yes

            [Install]
            WantedBy=multi-user.target
      runcmd:
        - systemctl daemon-reload
        - systemctl enable --now vdemo-resolved-domain.service

  metal3:
    clusterRef:
      cluster: loft-cluster
      namespace: metal3-system

    deploy:
      multus:
        enabled: true
        helmValues: |
          namespace: kube-system

      metal3:
        enabled: true
        helmValues: |
          ironic:
            image:
              tag: release-32.0

      dhcp:
        enabled: true
        helmValues: |
          networkAttachmentDefinition:
            vip: 172.22.0.2/24
            config: |
              {
                "cniVersion": "0.3.1",
                "type": "bridge",
                "bridge": "br-provision",
                "ipam": {}
              }

    nodeTypes:
      - name: customer-a-rack-a-small-node
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-a
              vmetal-rack: rack-a
              vmetal-size: small
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/rack: rack-a
          vcluster.com/profile: small
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: customer-a-rack-a-medium-node
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-a
              vmetal-rack: rack-a
              vmetal-size: medium
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/rack: rack-a
          vcluster.com/profile: medium
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: customer-a-rack-a-large-node
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-a
              vmetal-rack: rack-a
              vmetal-size: large
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/rack: rack-a
          vcluster.com/profile: large
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi

      - name: customer-a-rack-b-small-node
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-a
              vmetal-rack: rack-b
              vmetal-size: small
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/rack: rack-b
          vcluster.com/profile: small
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: customer-a-rack-b-medium-node
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-a
              vmetal-rack: rack-b
              vmetal-size: medium
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/rack: rack-b
          vcluster.com/profile: medium
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: customer-a-rack-b-large-node
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-a
              vmetal-rack: rack-b
              vmetal-size: large
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/rack: rack-b
          vcluster.com/profile: large
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi

      - name: customer-b-rack-b-small-node
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-b
              vmetal-rack: rack-b
              vmetal-size: small
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/rack: rack-b
          vcluster.com/profile: small
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: customer-b-rack-b-medium-node
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-b
              vmetal-rack: rack-b
              vmetal-size: medium
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/rack: rack-b
          vcluster.com/profile: medium
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: customer-b-rack-b-large-node
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-b
              vmetal-rack: rack-b
              vmetal-size: large
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/rack: rack-b
          vcluster.com/profile: large
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi

      - name: customer-b-rack-a-small-node
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-b
              vmetal-rack: rack-a
              vmetal-size: small
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/rack: rack-a
          vcluster.com/profile: small
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: customer-b-rack-a-medium-node
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-b
              vmetal-rack: rack-a
              vmetal-size: medium
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/rack: rack-a
          vcluster.com/profile: medium
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: customer-b-rack-a-large-node
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-customer: customer-b
              vmetal-rack: rack-a
              vmetal-size: large
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/rack: rack-a
          vcluster.com/profile: large
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi
