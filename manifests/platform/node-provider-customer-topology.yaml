# node-provider-customer-topology.yaml — data-center scoped Metal3 NodeProvider
#
# Rendered by hack/generate-node-provider-pools.py.
# Model:
#   - one NodeProvider per connected DC control-plane cluster
#   - BareMetalHost labels carry physical facts only
#   - NodeTypes represent schedulable rack/size pools
#   - customer assignment lives on NodeType properties
#
# Re-render after editing configs/rack-topology.csv or
# configs/rack-assignments.csv:
#   python3 hack/generate-node-provider-pools.py \
#     --rack-topology configs/rack-topology.csv \
#     --rack-assignments configs/rack-assignments.csv \
#     --output manifests/platform/node-provider-customer-topology.yaml

apiVersion: management.loft.sh/v1
kind: NodeProvider
metadata:
  name: us-va-blacksburg-dc1
spec:
  displayName: "vMetal Demo - Metal3 Provider (us-va-blacksburg-dc1)"

  properties:
    vcluster.com/os-image: ubuntu-noble-bootstrap
    vcluster.com/ssh-keys: admin-macbook
    vcluster.com/user-data: |
      #cloud-config
      write_files:
        - path: /etc/vcluster-common
          permissions: "0644"
          content: |
            common config
        - path: /usr/local/bin/configure-vdemo-node-bootstrap
          permissions: "0755"
          content: |
            #!/bin/sh
            set -eu

            iface="$(ip route show default 0.0.0.0/0 | awk 'NR==1 {print $5}')"
            [ -n "${iface}" ] || exit 1

            resolvectl domain "${iface}" '~vdemo.local'
            resolvectl default-route "${iface}" yes

            cert_tmp="$(mktemp)"
            tries=0
            while true; do
              if curl -fsSL "http://172.22.0.1:9000/vdemo-platform.crt" -o "${cert_tmp}"; then
                break
              fi
              tries=$((tries + 1))
              if [ "${tries}" -ge 20 ]; then
                echo "failed to download platform certificate after ${tries} attempts" >&2
                exit 1
              fi
              sleep 3
            done

            install -D -m 0644 "${cert_tmp}" /usr/local/share/ca-certificates/vdemo-platform.crt
            rm -f "${cert_tmp}"
            update-ca-certificates
            systemctl try-restart vcluster || true
        - path: /etc/systemd/system/vdemo-resolved-domain.service
          permissions: "0644"
          content: |
            [Unit]
            Description=Configure vdemo.local DNS routing and trust the platform certificate
            Wants=network-online.target
            After=network-online.target systemd-resolved.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/configure-vdemo-node-bootstrap
            RemainAfterExit=yes

            [Install]
            WantedBy=multi-user.target
      runcmd:
        - systemctl daemon-reload
        - systemctl enable --now vdemo-resolved-domain.service

  metal3:
    clusterRef:
      cluster: loft-cluster
      namespace: metal3-system

    deploy:
      multus:
        enabled: true
        helmValues: |
          namespace: kube-system

      metal3:
        enabled: true
        helmValues: |
          ironic:
            image:
              tag: release-32.0

      dhcp:
        enabled: true
        helmValues: |
          networkAttachmentDefinition:
            vip: 172.22.0.2/24
            config: |
              {
                "cniVersion": "0.3.1",
                "type": "bridge",
                "bridge": "br-provision",
                "ipam": {}
              }

    nodeTypes:
      - name: rack-a-small-pool
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              topology.vcluster.com/az: us-va-blacksburg-dc1
              topology.vcluster.com/row: row-1
              topology.vcluster.com/rack: rack-a
              inventory.vcluster.com/size: small
              inventory.vcluster.com/accelerator: cpu-only
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-a
          vcluster.com/profile: small
          vcluster.com/accelerator: cpu-only
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: rack-a-medium-pool
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              topology.vcluster.com/az: us-va-blacksburg-dc1
              topology.vcluster.com/row: row-1
              topology.vcluster.com/rack: rack-a
              inventory.vcluster.com/size: medium
              inventory.vcluster.com/accelerator: cpu-only
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-a
          vcluster.com/profile: medium
          vcluster.com/accelerator: cpu-only
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: rack-a-large-pool
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              topology.vcluster.com/az: us-va-blacksburg-dc1
              topology.vcluster.com/row: row-1
              topology.vcluster.com/rack: rack-a
              inventory.vcluster.com/size: large
              inventory.vcluster.com/accelerator: h100
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-a
          vcluster.com/profile: large
          vcluster.com/accelerator: h100
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi

      - name: rack-b-small-pool
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              topology.vcluster.com/az: us-va-blacksburg-dc1
              topology.vcluster.com/row: row-1
              topology.vcluster.com/rack: rack-b
              inventory.vcluster.com/size: small
              inventory.vcluster.com/accelerator: cpu-only
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-b
          vcluster.com/profile: small
          vcluster.com/accelerator: cpu-only
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: rack-b-medium-pool
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              topology.vcluster.com/az: us-va-blacksburg-dc1
              topology.vcluster.com/row: row-1
              topology.vcluster.com/rack: rack-b
              inventory.vcluster.com/size: medium
              inventory.vcluster.com/accelerator: cpu-only
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-b
          vcluster.com/profile: medium
          vcluster.com/accelerator: cpu-only
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: rack-b-large-pool
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              topology.vcluster.com/az: us-va-blacksburg-dc1
              topology.vcluster.com/row: row-1
              topology.vcluster.com/rack: rack-b
              inventory.vcluster.com/size: large
              inventory.vcluster.com/accelerator: h100
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-b
          vcluster.com/profile: large
          vcluster.com/accelerator: h100
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi

