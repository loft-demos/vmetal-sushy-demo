# node-provider-customer-topology.yaml — data-center scoped Metal3 NodeProvider
#
# Rendered by hack/generate-node-provider-pools.py.
# Model:
#   - one NodeProvider per connected DC control-plane cluster
#   - BareMetalHost labels carry physical facts only
#   - NodeTypes represent schedulable rack/size pools
#   - customer assignment lives on NodeType properties
#
# Re-render after editing configs/rack-topology.csv or
# configs/rack-assignments.csv:
#   python3 hack/generate-node-provider-pools.py \
#     --rack-topology configs/rack-topology.csv \
#     --rack-assignments configs/rack-assignments.csv \
#     --output manifests/platform/node-provider-customer-topology.yaml

apiVersion: management.loft.sh/v1
kind: NodeProvider
metadata:
  name: us-va-blacksburg-dc1
spec:
  displayName: "vMetal Demo - Metal3 Provider (us-va-blacksburg-dc1)"

  properties:
    vcluster.com/os-image: ubuntu-noble-bootstrap
    vcluster.com/ssh-keys: admin-bastion-host
    # The namespaced network-data template secret configures only the LAN NIC
    # in the installed node OS. Provisioning traffic stays on br-provision and
    # the running node is managed on its LAN IP.
    vcluster.com/network-data-template-secret: vcluster-platform/vmetal-dual-nic-network-template

  metal3:
    clusterRef:
      cluster: vmetal-cluster
      namespace: metal3-system

    deploy:
      multus:
        enabled: true
        helmValues: |
          namespace: kube-system

      metal3:
        enabled: true
        helmValues: |
          ironic:
            image:
              tag: release-32.0

      dhcp:
        enabled: true
        helmValues: |
          networkAttachmentDefinition:
            vip: 172.22.0.2/24
            config: |
              {
                "cniVersion": "0.3.1",
                "type": "bridge",
                "bridge": "br-provision",
                "ipam": {}
              }

    nodeTypes:
      - name: rack-a-small-pool
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchExpressions:
              - key: demo
                operator: In
                values:
                  - vmetal
              - key: topology.vcluster.com/az
                operator: In
                values:
                  - us-va-blacksburg-dc1
              - key: topology.vcluster.com/row
                operator: In
                values:
                  - row-1
              - key: topology.vcluster.com/rack
                operator: In
                values:
                  - rack-a
              - key: inventory.vcluster.com/size
                operator: In
                values:
                  - small
              - key: inventory.vcluster.com/accelerator
                operator: In
                values:
                  - cpu-only
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-a
          vcluster.com/profile: small
          vcluster.com/accelerator: cpu-only
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: rack-a-medium-pool
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchExpressions:
              - key: demo
                operator: In
                values:
                  - vmetal
              - key: topology.vcluster.com/az
                operator: In
                values:
                  - us-va-blacksburg-dc1
              - key: topology.vcluster.com/row
                operator: In
                values:
                  - row-1
              - key: topology.vcluster.com/rack
                operator: In
                values:
                  - rack-a
              - key: inventory.vcluster.com/size
                operator: In
                values:
                  - medium
              - key: inventory.vcluster.com/accelerator
                operator: In
                values:
                  - cpu-only
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-a
          vcluster.com/profile: medium
          vcluster.com/accelerator: cpu-only
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: rack-a-large-pool
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchExpressions:
              - key: demo
                operator: In
                values:
                  - vmetal
              - key: topology.vcluster.com/az
                operator: In
                values:
                  - us-va-blacksburg-dc1
              - key: topology.vcluster.com/row
                operator: In
                values:
                  - row-1
              - key: topology.vcluster.com/rack
                operator: In
                values:
                  - rack-a
              - key: inventory.vcluster.com/size
                operator: In
                values:
                  - large
              - key: inventory.vcluster.com/accelerator
                operator: In
                values:
                  - h100
        properties:
          vcluster.com/customer: customer-a
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-a
          vcluster.com/profile: large
          vcluster.com/accelerator: h100
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi

      - name: rack-b-small-pool
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchExpressions:
              - key: demo
                operator: In
                values:
                  - vmetal
              - key: topology.vcluster.com/az
                operator: In
                values:
                  - us-va-blacksburg-dc1
              - key: topology.vcluster.com/row
                operator: In
                values:
                  - row-1
              - key: topology.vcluster.com/rack
                operator: In
                values:
                  - rack-b
              - key: inventory.vcluster.com/size
                operator: In
                values:
                  - small
              - key: inventory.vcluster.com/accelerator
                operator: In
                values:
                  - cpu-only
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-b
          vcluster.com/profile: small
          vcluster.com/accelerator: cpu-only
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: rack-b-medium-pool
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchExpressions:
              - key: demo
                operator: In
                values:
                  - vmetal
              - key: topology.vcluster.com/az
                operator: In
                values:
                  - us-va-blacksburg-dc1
              - key: topology.vcluster.com/row
                operator: In
                values:
                  - row-1
              - key: topology.vcluster.com/rack
                operator: In
                values:
                  - rack-b
              - key: inventory.vcluster.com/size
                operator: In
                values:
                  - medium
              - key: inventory.vcluster.com/accelerator
                operator: In
                values:
                  - cpu-only
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-b
          vcluster.com/profile: medium
          vcluster.com/accelerator: cpu-only
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: rack-b-large-pool
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchExpressions:
              - key: demo
                operator: In
                values:
                  - vmetal
              - key: topology.vcluster.com/az
                operator: In
                values:
                  - us-va-blacksburg-dc1
              - key: topology.vcluster.com/row
                operator: In
                values:
                  - row-1
              - key: topology.vcluster.com/rack
                operator: In
                values:
                  - rack-b
              - key: inventory.vcluster.com/size
                operator: In
                values:
                  - large
              - key: inventory.vcluster.com/accelerator
                operator: In
                values:
                  - h100
        properties:
          vcluster.com/customer: customer-b
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/row: row-1
          vcluster.com/rack: rack-b
          vcluster.com/profile: large
          vcluster.com/accelerator: h100
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi

