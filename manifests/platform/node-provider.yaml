# node-provider.yaml — legacy Metal3 NodeProvider for the vmetal-sushy-demo
#
# This resource is kept as a legacy reference. The current customer/rack pool
# flow uses manifests/platform/node-provider-customer-topology.yaml rendered by
# hack/generate-node-provider-pools.py.
#
# Before applying:
#   1. Ensure the host cluster is connected to vCluster Platform and that
#      the cluster name below matches the name shown in the Platform UI.
#   2. Adjust the DHCP vip/bridge values if your provisioning network
#      differs from the defaults (172.22.0.0/24 / br-provision).
#
# Apply with:
#   kubectl apply -f manifests/platform/node-provider.yaml
#
# Reference:
#   https://www.vcluster.com/docs/platform/administer/node-providers/metal3

apiVersion: management.loft.sh/v1
kind: NodeProvider
metadata:
  name: metal3-provider
spec:
  displayName: "vMetal Demo - Metal3 Provider"

  properties:
    vcluster.com/os-image: ubuntu-noble-bootstrap
    vcluster.com/ssh-keys: admin-bastion-host
    # The network-data template secret lives in the vCluster Platform
    # namespace and configures only the LAN NIC in the installed node OS.
    # Provisioning still happens on br-provision via Metal3/Ironic.
    vcluster.com/network-data-template-secret: vcluster-platform/vmetal-dual-nic-network-template
  metal3:
    # clusterRef identifies the connected host cluster where Metal3 and Ironic
    # will be deployed. Update `cluster` to match the name of the connected
    # cluster as it appears in vCluster Platform.
    clusterRef:
      cluster: vmetal-cluster
      namespace: metal3-system

    deploy:
      # Multus CNI is required so Ironic can attach network interfaces
      # directly to the provisioning bridge.
      multus:
        enabled: true
        helmValues: |
          namespace: kube-system

      # Metal3 and Ironic handle PXE boot, hardware inspection, and OS
      # provisioning. These run as platform-managed components; you do not
      # need to install them manually.
      metal3:
        enabled: true
        helmValues: |
          ironic:
            image:
              tag: release-32.0

      # The DHCP server is deployed by the provider and attached to the
      # provisioning bridge via a Multus NetworkAttachmentDefinition.
      # vip must be an unused IP on the provisioning subnet.
      # bridge must match the bridge name created by create-bridges.sh.
      dhcp:
        enabled: true
        helmValues: |
          networkAttachmentDefinition:
            vip: 172.22.0.2/24
            config: |
              {
                "cniVersion": "0.3.1",
                "type": "bridge",
                "bridge": "br-provision",
                "ipam": {}
              }

    # nodeTypes define classes of bare-metal machines the provider can claim.
    # The selector.matchLabels model both rack placement and explicit size
    # classes on BareMetalHosts. CPU and memory still declare the capacity that
    # Karpenter sees for each node type.
    #
    # resources + properties (cpu/memory) declare node capacity so Karpenter
    # can make scale-from-zero scheduling decisions for dynamic node pools.
    # The dynamic vmetal-template intentionally does not constrain size, so it
    # can fall back to larger node types within the selected rack set.
    # Each node type also gets an in-built property:
    #   vcluster.com/node-type = <node type name>
    # That lets a vCluster target one specific machine class cleanly.
    nodeTypes:
      - name: rack-a-small-node
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-rack: rack-a
              vmetal-size: small
        properties:
          vcluster.com/rack: rack-a
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: rack-a-medium-node
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-rack: rack-a
              vmetal-size: medium
        properties:
          vcluster.com/rack: rack-a
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: rack-a-large-node
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-rack: rack-a
              vmetal-size: large
        properties:
          vcluster.com/rack: rack-a
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi

      - name: rack-b-small-node
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-rack: rack-b
              vmetal-size: small
        properties:
          vcluster.com/rack: rack-b
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi

      - name: rack-b-medium-node
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-rack: rack-b
              vmetal-size: medium
        properties:
          vcluster.com/rack: rack-b
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi

      - name: rack-b-large-node
        resources:
          cpu: "4"
          memory: 8Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              vmetal-rack: rack-b
              vmetal-size: large
        properties:
          vcluster.com/rack: rack-b
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi
