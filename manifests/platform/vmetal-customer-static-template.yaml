# vmetal-customer-static-template.yaml — customer+rack aware private-node template
#
# This template is aimed at dedicated-rack / AI-cloud style topology where the
# consumer experience should be able to target both the customer assignment and
# the rack boundary through node-type properties.
#
# Apply with:
#   kubectl apply -f manifests/platform/vmetal-customer-static-template.yaml

apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: vmetal-customer-static-template
spec:
  displayName: "vMetal - Customer Scoped Bare Metal"
  description: >
    vCluster backed by fixed-size bare metal node pools provisioned through the
    Metal3 NodeProvider. Pools are selected by both customer assignment and
    physical rack identity.

  owner:
    team: loft-admins

  template:
    helmRelease:
      chart:
        version: 0.34.0
      values: |
        privateNodes:
          enabled: true
          autoNodes:
            - provider: metal3-provider
              static:
                {{ if ne .Values.largeNodeCount "0" }}
                - name: customer-rack-large-nodes
                  quantity: {{ .Values.largeNodeCount }}
                  nodeTypeSelector:
                    - property: vcluster.com/customer
                      operator: In
                      values:
                        - {{ .Values.customerSelector }}
                    - property: vcluster.com/rack
                      operator: In
                      values:
                        - {{ .Values.rackSelector }}
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - large
                {{ end }}
                {{ if ne .Values.mediumNodeCount "0" }}
                - name: customer-rack-medium-nodes
                  quantity: {{ .Values.mediumNodeCount }}
                  nodeTypeSelector:
                    - property: vcluster.com/customer
                      operator: In
                      values:
                        - {{ .Values.customerSelector }}
                    - property: vcluster.com/rack
                      operator: In
                      values:
                        - {{ .Values.rackSelector }}
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - medium
                {{ end }}
                {{ if ne .Values.smallNodeCount "0" }}
                - name: customer-rack-small-nodes
                  quantity: {{ .Values.smallNodeCount }}
                  nodeTypeSelector:
                    - property: vcluster.com/customer
                      operator: In
                      values:
                        - {{ .Values.customerSelector }}
                    - property: vcluster.com/rack
                      operator: In
                      values:
                        - {{ .Values.rackSelector }}
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - small
                {{ end }}
        networking:
          podCIDR: 10.64.0.0/16
          serviceCIDR: 10.128.0.0/16
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          statefulSet:
            highAvailability:
              replicas: {{ .Values.controlPlaneReplicas }}
          distro:
            k8s:
              version: "{{ .Values.kubernetesVersion }}"

  parameters:
    - variable: kubernetesVersion
      label: Kubernetes Version
      defaultValue: v1.34.7
      options:
        - v1.33.11
        - v1.34.7
        - v1.35.4

    - variable: controlPlaneReplicas
      label: Control Plane Replicas
      description: >
        Set to 3 to demonstrate HA with embedded etcd.
      defaultValue: "3"
      options:
        - "1"
        - "3"

    - variable: customerSelector
      label: Customer Selector
      defaultValue: customer-a

    - variable: rackSelector
      label: Rack Selector
      defaultValue: rack-a

    - variable: smallNodeCount
      label: Small Node Count
      defaultValue: "0"
      options:
        - "0"
        - "1"
        - "2"

    - variable: mediumNodeCount
      label: Medium Node Count
      defaultValue: "0"
      options:
        - "0"
        - "1"
        - "2"

    - variable: largeNodeCount
      label: Large Node Count
      defaultValue: "1"
      options:
        - "0"
        - "1"
        - "2"
