#
# Post-boot node networking template for the vMetal demo.
# Metal3/Ironic still use the provisioning NIC during PXE and image delivery,
# but the installed node OS only configures the LAN NIC. That keeps kubelet,
# SSH, and NodePort/LoadBalancer traffic on the LAN address instead of the
# temporary provisioning subnet.
#
apiVersion: v1
kind: Secret
metadata:
  name: vmetal-dual-nic-network-template
  namespace: vcluster-platform
  labels:
    vcluster.com/user-data-template-type: network-data
type: Opaque
stringData:
  data: |
    {
      "links": [
        {
          "id": "lan-nic",
          "type": "phy",
          "ethernet_mac_address": "{{ index .Values.BareMetalHost "metadata" "annotations" "lan.vcluster.com/mac" }}"
        }
      ],
      "networks": [
        {
          "id": "lan-net",
          "link": "lan-nic",
          "type": "ipv4_dhcp"
        }
      ],
      "services": [
        {
          "type": "dns",
          "address": "192.168.50.1"
        }
      ],
      "meta": {
        "host": "{{ index .Values.BareMetalHost "metadata" "name" }}",
        "claim": "{{ .Values.NodeClaim.Name }}",
        "project": "{{ .Values.Project }}",
        "network": "lan-only-postboot",
        "lan_mac": "{{ index .Values.BareMetalHost "metadata" "annotations" "lan.vcluster.com/mac" }}"
      }
    }
