# vcluster-vmetal.yaml — VirtualClusterInstance backed by vmetal-template
#
# Creates a vCluster in the Default Project that provisions bare metal nodes
# via the Metal3 NodeProvider. The backing inventory is spread across two
# simulated racks, and node sizing is derived from the inspected hardware. Set
# customerSelector to scope the pool to one or more customer-assigned pools and
# optionally use rackSelector to narrow that capacity to specific racks.
#
# Apply with:
#   kubectl apply -f manifests/platform/vmetal-template.yaml   # once
#   kubectl apply -f manifests/platform/vcluster-vmetal.yaml
#
# Watch provisioning:
#   kubectl get virtualclusterinstances -n p-default
#   kubectl get nodeclaims -A -w
#   kubectl get baremetalhosts -n metal3-system
#
# Upgrade demo — bump kubernetesVersion and re-apply:
#   # Edit this file: kubernetesVersion: v1.35.4
#   kubectl apply -f manifests/platform/vcluster-vmetal.yaml
#   # vCluster Platform performs a rolling control plane upgrade.
#   # Watch: kubectl get virtualclusterinstances -n p-default -w
#
# Reference:
#   https://www.vcluster.com/docs/platform/administer/node-providers/metal3

apiVersion: management.loft.sh/v1
kind: VirtualClusterInstance
metadata:
  name: vmetal-demo
  namespace: p-default
spec:
  owner:
    user: admin
  templateRef:
    name: vmetal-template
  clusterRef:
    cluster: loft-cluster
  parameters: |
    kubernetesVersion: v1.34.7
    cpuLimit: "5"
    customerSelector: ""
    rackSelector: ""
