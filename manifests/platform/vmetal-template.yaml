# vmetal-template.yaml — VirtualClusterTemplate for bare metal private nodes
#
# Parameterized template that provisions a vCluster backed by real bare metal
# nodes via the data-center scoped `us-va-blacksburg-dc1` NodeProvider.
# Workers are claimed from available BareMetalHosts matching the selected node type.
#
# Parameters:
#   kubernetesVersion — control plane K8s version; update to trigger an upgrade
#   cpuLimit          — maximum CPUs to provision across the private node pool
#   customerSelector  — optional comma-separated list of customer-assigned pools to target
#   rackSelector      — optional comma-separated list of racks to target
#
# Apply with:
#   kubectl apply -f manifests/platform/vmetal-template.yaml
#
# Then create a VirtualClusterInstance that references this template:
#   kubectl apply -f manifests/platform/vcluster-vmetal.yaml
#
# Upgrade demo:
#   Edit vcluster-vmetal.yaml and bump kubernetesVersion (e.g. v1.34.7 → v1.35.4),
#   then re-apply. vCluster Platform re-renders the helm release and performs a
#   rolling control plane upgrade. The bare metal node's kubelet is managed
#   separately by the NodeClaim reprovisioning cycle.
#
# Reference:
#   https://www.vcluster.com/docs/platform/administer/node-providers/metal3

apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: vmetal-template
spec:
  displayName: "vMetal — Dynamic Bare Metal Auto Nodes"
  description: >
    vCluster backed by bare metal nodes provisioned on demand via the
    Metal3 NodeProvider. Nodes are claimed from available BareMetalHosts,
    written with Ubuntu 24.04, and joined as workers automatically.

  owner:
    team: loft-admins

  template:
    helmRelease:
      chart:
        version: 0.34.0
      values: |
        privateNodes:
          enabled: true
          autoNodes:
            - provider: us-va-blacksburg-dc1
              dynamic:
                - name: bm-dynamic-node-pool-1
                  limits:
                    cpu: '{{ .Values.cpuLimit }}'
                  {{- if or (and .Values.customerSelector (ne (trim .Values.customerSelector) "") (ne (trim .Values.customerSelector) "all")) (and .Values.rackSelector (ne (trim .Values.rackSelector) "") (ne (trim .Values.rackSelector) "all")) }}
                  nodeTypeSelector:
                    {{- if and .Values.customerSelector (ne (trim .Values.customerSelector) "") (ne (trim .Values.customerSelector) "all") }}
                    - property: vcluster.com/customer
                      operator: In
                      values:
                        {{- range $customer := splitList "," .Values.customerSelector }}
                        {{- $trimmedCustomer := trim $customer }}
                        {{- if ne $trimmedCustomer "" }}
                        - {{ $trimmedCustomer }}
                        {{- end }}
                        {{- end }}
                    {{- end }}
                    {{- if and .Values.rackSelector (ne (trim .Values.rackSelector) "") (ne (trim .Values.rackSelector) "all") }}
                    - property: vcluster.com/rack
                      operator: In
                      values:
                        {{- range $rack := splitList "," .Values.rackSelector }}
                        {{- $trimmedRack := trim $rack }}
                        {{- if ne $trimmedRack "" }}
                        - {{ $trimmedRack }}
                        {{- end }}
                        {{- end }}
                    {{- end }}
                  {{- end }}
        networking:
          podCIDR: 10.64.0.0/16
          serviceCIDR: 10.128.0.0/16
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          distro:
            k8s:
              version: "{{ .Values.kubernetesVersion }}"

  # ---------------------------------------------------------------------------
  # Parameters — surfaced in the vCluster Platform UI and passed to helm values
  # ---------------------------------------------------------------------------
  parameters:
    - variable: kubernetesVersion
      label: Kubernetes Version
      description: >
        Control plane Kubernetes version. Updating this value triggers a
        rolling upgrade of the vCluster control plane. The bare metal node
        kubelet is re-provisioned separately via the NodeClaim lifecycle.
      defaultValue: v1.34.7
      options:
        - v1.33.11
        - v1.34.7
        - v1.35.4

    - variable: cpuLimit
      label: CPU Limit
      description: >
        Maximum CPUs that can be provisioned by this node pool.
      defaultValue: "5"
      options:
        - "2"
        - "5"
        - "7"
        - "9"

    - variable: customerSelector
      label: Customer Selector
      description: >
        Optional comma-separated customer list such as `customer-a` or
        `customer-a,customer-b`. This filters NodeType properties, not
        BareMetalHost labels directly. Leave empty to allow all customers.
      defaultValue: ""

    - variable: rackSelector
      label: Rack Selector
      description: >
        Optional comma-separated rack list such as `rack-a` or
        `rack-a,rack-b`. Leave empty to allow all racks for the selected
        customer set.
      defaultValue: ""
